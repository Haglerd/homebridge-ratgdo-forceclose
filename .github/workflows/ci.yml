name: CI

# Lightweight sanity checks on every PR and every push to main.
# Goal: catch syntax breaks, broken JSON, and obvious package-config issues
# before they land. Mirrors the in-publish-workflow checks so PR authors
# don't have to wait until release time to find out something's wrong.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sanity:
    runs-on: ubuntu-latest

    strategy:
      # Run on Node 18, 20, and 22 — the package.json engines field declares
      # >=18, so all three should pass. Catches accidental use of newer-Node
      # syntax or APIs that wouldn't run on a Pi still on Node 18 LTS.
      matrix:
        node-version: ['18', '20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: index.js parses
        run: node --check index.js

      - name: package.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: config.schema.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('config.schema.json','utf8'))"

      - name: package.json declares the homebridge-plugin keyword
        # Required by Homebridge for the UI to discover this as a plugin.
        # If someone removes it accidentally, the plugin disappears from search.
        run: |
          node -e "
          const pkg = require('./package.json');
          const kw = pkg.keywords || [];
          if (!kw.includes('homebridge-plugin')) {
            console.error('::error::package.json keywords must include \"homebridge-plugin\"');
            process.exit(1);
          }
          console.log('homebridge-plugin keyword present ✓');
          "

      - name: Smoke tests
        run: npm test

  hb2-load:
    # Smoke-load the plugin under a real Homebridge process to catch
    # accessory-registration regressions before HB 2.0 ships. Runs only
    # on Node 22 (HB 2.0's target runtime). Fails CI if the plugin
    # crashes during init or never logs the registration line.
    runs-on: ubuntu-latest
    needs: sanity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Homebridge (latest stable)
        run: npm i -g homebridge
      - name: Install plugin globally from local source
        run: npm i -g .
      - name: Write minimal config + storage dir
        run: |
          mkdir -p ~/.homebridge
          cat > ~/.homebridge/config.json <<'JSON'
          {
            "bridge": { "name": "Test Bridge", "username": "CC:22:3D:E3:CE:30", "port": 51826, "pin": "031-45-154" },
            "accessories": [
              { "accessory": "RatgdoForceClose", "name": "Test Door", "ratgdoHost": "http://127.0.0.1:1" }
            ]
          }
          JSON
      - name: Boot Homebridge briefly + verify our accessory loads
        run: |
          # Run for ~12s, then SIGTERM. Grep for our log line to prove
          # the accessory registered without crashing the bridge.
          set -e
          (timeout 12 homebridge -D 2>&1 | tee /tmp/hb.log) || true
          if grep -q 'RatgdoForceClose' /tmp/hb.log; then
            echo '::notice::RatgdoForceClose accessory loaded by Homebridge ✓'
          else
            echo '::error::Accessory did not register in Homebridge log'
            tail -100 /tmp/hb.log
            exit 1
          fi
